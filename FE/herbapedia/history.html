<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cộng đồng - HerbaPedia</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        main > div:not(#postCreator):not(#communityFeed) { display: none; }
    </style>
</head>
<body class=" font-sans text-gray-800 min-h-screen relative flex flex-col selection:bg-yellow-200" style="background-image: linear-gradient(rgba(238, 247, 235, 0.85), rgba(210, 235, 205, 0.9)), url('assets/images/background-forest.jpg'); background-size: cover; background-attachment: fixed; background-position: center;">

    <!-- Header / Navbar -->
    <header id="navbar" class="sticky top-0 w-full z-40 transition-all duration-300">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center backdrop-blur-md bg-white/60 border-b border-gray-100 shadow-sm mt-2 rounded-full">
            <a href="index.html" class="flex items-center gap-2 text-[#0A2F1D] cursor-pointer hover:opacity-80 transition">
                <img src="assets/images/logo.png" alt="HerbaPedia Logo" class="w-8 h-8 object-contain">
                <span class="text-xl font-bold tracking-wide font-sans">Herba<span class="text-[#8CC63F]">Pedia</span></span>
            </a>
            <ul class="hidden md:flex gap-8 text-sm font-semibold text-gray-600 items-center nav-links">
                <li><a href="index.html" class="hover:text-[#0A2F1D] transition-colors pb-1 border-b-2 border-transparent">Trang chủ</a></li>
                <li><a href="search.html" class="hover:text-[#0A2F1D] transition-colors pb-1 border-b-2 border-transparent">Tra cứu</a></li>
                <li><a href="history.html" class="text-[#0A2F1D] transition-colors pb-1 border-b-2 border-yellow-400">Cộng đồng</a></li>
                                <li class="relative group">
                    <button class="flex items-center gap-2 bg-white border border-gray-200 px-3 py-1.5 rounded-full hover:shadow-sm transition-all focus:outline-none">
                        <img id="communityUserAvatar" src="assets/images/logo.png" alt="Ảnh đại diện" class="w-7 h-7 rounded-full object-cover">
                        <span id="communityUserName" class="font-bold text-[#0A2F1D] text-sm">Hi,</span>
                        <i data-feather="chevron-down" class="w-4 h-4 text-gray-500 group-hover:rotate-180 transition-transform"></i>
                    </button>
                    <!-- Dropdown Menu -->
                    <div class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-50 transform origin-top-right scale-95 group-hover:scale-100">
                        <div class="py-1">
                            <a href="profile.html" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-[#eef1e6] hover:text-[#1b3b22] hover:font-semibold transition-colors">
                                <i data-feather="user" class="w-4 h-4 text-gray-500"></i> Hồ sơ cá nhân
                            </a>
                            <a id="communityBlogLink" href="user-profile.html" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-[#eef1e6] hover:text-[#1b3b22] hover:font-semibold transition-colors">
                                <i data-feather="book-open" class="w-4 h-4 text-gray-500"></i> Blog cá nhân
                            </a>
                            <a href="personal-history.html" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-[#eef1e6] hover:text-[#1b3b22] hover:font-semibold transition-colors">
                                <i data-feather="clock" class="w-4 h-4 text-gray-500"></i> Lịch sử cá nhân
                            </a>
                        </div>
                        <div class="border-t border-gray-100 py-1">
                            <button class="flex w-full items-center gap-3 px-4 py-2.5 text-sm text-red-500 hover:bg-red-50 transition-colors">
                                <i data-feather="log-out" class="w-4 h-4"></i> Đăng xuất
                            </button>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </header>

    <main class="max-w-[680px] mx-auto w-full px-4 py-8 z-10 flex-1">
        
        <!-- Post Creator Trigger Box -->
        <div id="postCreator" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-6">
            <div class="flex items-center gap-3 mb-3">
                <img id="communityPostCreatorAvatar" src="assets/images/logo.png" alt="Ảnh đại diện của bạn" class="w-10 h-10 rounded-full object-cover shrink-0">
                <button id="btnOpenPostModal" class="flex-1 bg-gray-50 hover:bg-gray-100 text-left text-gray-500 px-4 py-2.5 rounded-full transition-colors text-sm border border-transparent">
                    Bạn có bài thuốc hay muốn chia sẻ?
                </button>
            </div>
            <div class="flex items-center gap-2 pt-2 border-t border-gray-50">
                <button id="btnOpenImagePostModal" type="button" class="flex items-center gap-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 px-3 py-2 rounded-lg text-sm font-semibold transition-colors">
                    <i data-feather="image" class="w-5 h-5 text-gray-400"></i> Hình ảnh
                </button>
                <button id="btnOpenRemedyPostModal" type="button" class="flex items-center gap-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 px-3 py-2 rounded-lg text-sm font-semibold transition-colors">
                    <i data-feather="book-open" class="w-5 h-5 text-gray-400"></i> Công thức
                </button>
            </div>
        </div>

        <div id="communityFeed" class="space-y-5"></div>

    </main>

    <!-- Modal Tạo bài viết -->
    <div id="createPostModal" class="fixed inset-0 z-[60] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" id="createPostBackdrop"></div>
        <div class="relative w-full max-w-3xl bg-white rounded-2xl shadow-xl flex flex-col max-h-[90vh] overflow-hidden transform scale-95 transition-transform duration-300" id="createPostContent">
            
            <!-- Header -->
            <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-white z-10">
                <h3 class="font-bold text-xl text-[#0A2F1D]">Tạo bài viết</h3>
                <button id="btnClosePostModal" class="w-8 h-8 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center hover:bg-gray-200 transition-colors">
                    <i data-feather="x" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Modal Body (Scrollable) -->
            <div class="p-6 overflow-y-auto custom-scrollbar flex-1 bg-white">
                
                <!-- 2 Tabs (Pills) -->
                <div class="flex gap-3 mb-6 bg-gray-50 p-1.5 rounded-xl border border-gray-100 w-max">
                    <button id="btnTabNormalPost" class="px-5 py-2 rounded-lg font-bold text-sm bg-white text-[#0A2F1D] shadow-sm transition-all border border-gray-200">Chia sẻ chung</button>
                    <button id="btnTabRemedyPost" class="px-5 py-2 rounded-lg font-bold text-sm text-gray-500 hover:text-gray-700 transition-all border border-transparent">Đóng góp bài thuốc</button>
                </div>

                <!-- FORM 1: Chia sẻ chung -->
                <div id="formNormalPost" class="flex flex-col gap-4">
                    <input id="normalPostTitle" type="text" placeholder="Nhập tiêu đề..." class="w-full text-lg font-bold text-gray-800 placeholder-gray-400 border border-gray-200 rounded-lg px-4 py-3 outline-none focus:border-[#8CC63F] focus:ring-1 focus:ring-[#8CC63F]">
                    
                    <textarea id="normalPostContent" placeholder="Bạn muốn chia sẻ điều gì?" class="w-full h-32 resize-none text-gray-700 placeholder-gray-400 border border-gray-200 rounded-lg px-4 py-3 outline-none focus:border-[#8CC63F] focus:ring-1 focus:ring-[#8CC63F]"></textarea>

                    <label for="normalPostImage" class="border-2 border-dashed border-gray-200 rounded-lg p-6 flex flex-col items-center justify-center text-gray-400 hover:bg-gray-50 hover:border-[#8CC63F] transition-colors cursor-pointer group">
                        <img id="normalPostImagePreview" alt="Ảnh xem trước bài viết" class="hidden w-full max-h-56 object-cover rounded-lg mb-3">
                        <div data-upload-placeholder class="bg-gray-100 p-3 rounded-full mb-2 group-hover:bg-[#F7F9F5] group-hover:text-[#8CC63F] transition-colors">
                            <i data-feather="image" class="w-6 h-6"></i>
                        </div>
                        <span data-upload-label class="text-sm font-semibold">Tải ảnh lên (hoặc kéo thả)</span>
                        <span id="normalPostImageName" class="text-xs mt-1"></span>
                        <button type="button" data-remove-image="normalPostImage" class="hidden mt-2 text-xs font-bold text-red-500 hover:underline">Xóa ảnh</button>
                        <input id="normalPostImage" type="file" accept="image/jpeg,image/png,image/webp" class="hidden">
                    </label>
                </div>

                <!-- FORM 2: Đóng góp bài thuốc -->
                <div id="formRemedyPost" class="hidden flex-col gap-5">
                    
                    <!-- Thông tin chung -->
                    <div class="flex flex-col gap-4">
                        <input id="remedyPostTitle" type="text" placeholder="Tên bài thuốc..." class="w-full text-lg font-bold text-gray-800 placeholder-gray-400 border border-gray-200 rounded-lg px-4 py-3 outline-none focus:border-[#8CC63F] focus:ring-1 focus:ring-[#8CC63F]">
                        
                        <textarea id="remedyPostContent" placeholder="Công thức & Cách làm..." class="w-full h-24 resize-none text-gray-700 placeholder-gray-400 border border-gray-200 rounded-lg px-4 py-3 outline-none focus:border-[#8CC63F] focus:ring-1 focus:ring-[#8CC63F]"></textarea>

                        <label for="remedyPostImage" class="border-2 border-dashed border-gray-200 rounded-lg p-4 flex flex-col items-center justify-center text-gray-400 hover:bg-gray-50 hover:border-[#8CC63F] transition-colors cursor-pointer group">
                            <img id="remedyPostImagePreview" alt="Ảnh xem trước bài thuốc" class="hidden w-full max-h-56 object-cover rounded-lg mb-3">
                            <i data-upload-placeholder data-feather="image" class="w-5 h-5 mb-1 group-hover:text-[#8CC63F]"></i>
                            <span data-upload-label class="text-xs font-semibold">Tải ảnh minh họa</span>
                            <span id="remedyPostImageName" class="text-xs mt-1"></span>
                            <button type="button" data-remove-image="remedyPostImage" class="hidden mt-2 text-xs font-bold text-red-500 hover:underline">Xóa ảnh</button>
                            <input id="remedyPostImage" type="file" accept="image/jpeg,image/png,image/webp" class="hidden">
                        </label>
                    </div>

                    <!-- Thành phần vị thuốc -->
                    <div class="bg-gray-50 p-5 rounded-xl border border-gray-100 mt-2">
                        <div class="flex justify-between items-center mb-4">
                            <h4 class="font-bold text-[#0A2F1D] text-sm flex items-center gap-2"><i data-feather="list" class="w-4 h-4 text-[#8CC63F]"></i> Thành phần vị thuốc</h4>
                            <button class="text-xs font-bold text-[#8CC63F] border border-[#8CC63F] px-3 py-1.5 rounded-full hover:bg-[#F7F9F5] transition-colors flex items-center gap-1">
                                <i data-feather="plus" class="w-3 h-3"></i> Thêm vị thuốc
                            </button>
                        </div>

                        <!-- Danh sách các vị thuốc (Field Array) -->
                        <div class="flex flex-col gap-3">
                            
                            <!-- Row 1 -->
                            <div class="flex gap-2 items-center bg-white p-2 border border-gray-200 rounded-lg shadow-sm">
                                <input type="text" placeholder="Tên vị thuốc..." class="flex-1 px-3 py-2 text-sm border border-gray-200 rounded-md outline-none focus:border-[#8CC63F]">
                                <input type="text" placeholder="Hàm lượng (vd: 10g)" class="w-32 px-3 py-2 text-sm border border-gray-200 rounded-md outline-none focus:border-[#8CC63F]">
                                <input type="text" placeholder="Ghi chú..." class="flex-1 px-3 py-2 text-sm border border-gray-200 rounded-md outline-none focus:border-[#8CC63F]">
                                <button class="p-2 text-red-500 hover:bg-red-50 rounded-md transition-colors"><i data-feather="trash-2" class="w-4 h-4"></i></button>
                            </div>
                            
                            <!-- Row 2 -->
                            <div class="flex gap-2 items-center bg-white p-2 border border-gray-200 rounded-lg shadow-sm">
                                <input type="text" placeholder="Tên vị thuốc..." class="flex-1 px-3 py-2 text-sm border border-gray-200 rounded-md outline-none focus:border-[#8CC63F]">
                                <input type="text" placeholder="Hàm lượng (vd: 10g)" class="w-32 px-3 py-2 text-sm border border-gray-200 rounded-md outline-none focus:border-[#8CC63F]">
                                <input type="text" placeholder="Ghi chú..." class="flex-1 px-3 py-2 text-sm border border-gray-200 rounded-md outline-none focus:border-[#8CC63F]">
                                <button class="p-2 text-red-500 hover:bg-red-50 rounded-md transition-colors"><i data-feather="trash-2" class="w-4 h-4"></i></button>
                            </div>

                        </div>
                    </div>

                </div>

            </div>

            <!-- Footer chung -->
            <div class="p-5 border-t border-gray-100 bg-gray-50 flex flex-col sm:flex-row justify-between items-center gap-4">
                <p class="text-xs italic text-gray-500 max-w-xs text-center sm:text-left">Bài viết sẽ được hiển thị ngay trong cộng đồng.</p>
                <div class="flex gap-3 w-full sm:w-auto">
                    <button id="btnCancelPostModal" class="flex-1 sm:flex-none text-gray-500 font-bold px-6 py-2.5 rounded-full hover:bg-gray-200 transition-colors">Hủy</button>
                    <button id="btnSubmitPost" class="flex-1 sm:flex-none bg-[#0A2F1D] text-white font-bold px-8 py-2.5 rounded-full hover:bg-[#134E34] shadow-md transition-all">Đăng bài</button>
                </div>
            </div>
        </div>
    </div>

    
    <!-- Modal Xem Ảnh (Lightbox) -->
    <div id="imageLightboxModal" class="fixed inset-0 z-[70] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="absolute inset-0 bg-black/90 backdrop-blur-sm cursor-pointer" id="lightboxBackdrop"></div>
        <button id="btnCloseLightbox" class="absolute top-4 right-4 text-white hover:text-gray-300 z-10 p-2">
            <i data-feather="x" class="w-8 h-8"></i>
        </button>
        <img id="lightboxImage" src="" class="max-w-full max-h-[90vh] object-contain relative z-10 rounded-lg shadow-2xl transform scale-95 transition-transform duration-300">
    </div>

<script src="assets/js/main.js"></script>
<script src="assets/js/community.js"></script>
<script>
        feather.replace();

        // Logic Modal Tạo Bài Viết
        const btnOpen = document.getElementById('btnOpenPostModal');
        const btnClose = document.getElementById('btnClosePostModal');
        const backdrop = document.getElementById('createPostBackdrop');
        const modal = document.getElementById('createPostModal');
        const modalContent = document.getElementById('createPostContent');

        function selectPostTab(tab) {
            const isRemedy = tab === 'remedy';
            btnTabNormal.className = isRemedy
                ? "px-5 py-2 rounded-lg font-bold text-sm text-gray-500 hover:text-gray-700 transition-all border border-transparent"
                : "px-5 py-2 rounded-lg font-bold text-sm bg-white text-[#0A2F1D] shadow-sm transition-all border border-gray-200";
            btnTabRemedy.className = isRemedy
                ? "px-5 py-2 rounded-lg font-bold text-sm bg-white text-[#0A2F1D] shadow-sm transition-all border border-gray-200"
                : "px-5 py-2 rounded-lg font-bold text-sm text-gray-500 hover:text-gray-700 transition-all border border-transparent";
            formNormal.style.display = isRemedy ? 'none' : 'flex';
            formRemedy.style.display = isRemedy ? 'flex' : 'none';
        }

        function openModal(tab = 'normal') {
            selectPostTab(tab);
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95');
            document.body.style.overflow = 'hidden';
        }
        function closeModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.add('scale-95');
            document.body.style.overflow = '';
        }

        btnOpen.addEventListener('click', () => openModal('normal'));
        document.getElementById('btnOpenImagePostModal').addEventListener('click', () => openModal('normal'));
        document.getElementById('btnOpenRemedyPostModal').addEventListener('click', () => openModal('remedy'));
        btnClose.addEventListener('click', closeModal);
        backdrop.addEventListener('click', closeModal);
        const btnCancel = document.getElementById('btnCancelPostModal');
        if (btnCancel) btnCancel.addEventListener('click', closeModal);
        // Logic Tab trong Modal Tạo Bài Viết
        const btnTabNormal = document.getElementById('btnTabNormalPost');
        const btnTabRemedy = document.getElementById('btnTabRemedyPost');
        const formNormal = document.getElementById('formNormalPost');
        const formRemedy = document.getElementById('formRemedyPost');

        if(btnTabNormal && btnTabRemedy) {
            btnTabNormal.addEventListener('click', () => {
                selectPostTab('normal');
            });
            btnTabRemedy.addEventListener('click', () => {
                selectPostTab('remedy');
            });
        }

        // Chuyển hướng khi click vào Avatar hoặc tác giả có data-user-id
        document.body.addEventListener('click', function(e) {
            if (e.target.closest('a')) return;
            const target = e.target.closest('[data-user-id]');
            if (target) {
                const uid = target.getAttribute('data-user-id');
                if (uid) window.location.href = `user-profile.html?userId=${encodeURIComponent(uid)}`;
            }
        });




        
        // Logic Modal Xem Ảnh (Lightbox)
        const lightboxModal = document.getElementById('imageLightboxModal');
        const lightboxImg = document.getElementById('lightboxImage');
        const lightboxBackdrop = document.getElementById('lightboxBackdrop');
        const btnCloseLightbox = document.getElementById('btnCloseLightbox');

        function openLightbox(src) {
            if(!lightboxModal) return;
            lightboxImg.src = src;
            lightboxModal.classList.remove('opacity-0', 'pointer-events-none');
            lightboxImg.classList.remove('scale-95');
        }

        function closeLightbox() {
            if(!lightboxModal) return;
            lightboxModal.classList.add('opacity-0', 'pointer-events-none');
            lightboxImg.classList.add('scale-95');
            setTimeout(() => { lightboxImg.src = ''; }, 300);
        }

        document.body.addEventListener('click', function(e) {
            // Check if click is on an image inside a post, and not an avatar
            if (e.target.tagName === 'IMG' && !e.target.classList.contains('rounded-full') && !e.target.closest('header') && !e.target.closest('#imageLightboxModal')) {
                // If it's a feed image, open it
                openLightbox(e.target.src);
            }
        });

        if (btnCloseLightbox) btnCloseLightbox.addEventListener('click', closeLightbox);
        if (lightboxBackdrop) lightboxBackdrop.addEventListener('click', closeLightbox);


    
        



    </script>
</body>
</html>
