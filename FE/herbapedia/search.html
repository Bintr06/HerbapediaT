<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Từ điển Dược liệu - HerbaPedia</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .tag-pill { @apply bg-white border border-gray-200 px-5 py-2 rounded-full cursor-pointer font-semibold text-sm transition-all text-gray-600 shadow-sm whitespace-nowrap; }
            .tag-pill:hover { @apply  border-gray-300; }
            .tag-pill.active { @apply bg-[#0A2F1D] border-[#0A2F1D] text-white shadow-md; }
            
            .hide-scrollbar::-webkit-scrollbar { display: none; }
            .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        }
    </style>
</head>
<body class=" font-sans text-gray-800 min-h-screen relative flex flex-col selection:bg-yellow-200" style="background-image: linear-gradient(rgba(238, 247, 235, 0.85), rgba(210, 235, 205, 0.9)), url('assets/images/background-forest.jpg'); background-size: cover; background-attachment: fixed; background-position: center;">

    <!-- Header / Navbar -->
    <header id="navbar" class="sticky top-0 w-full z-40 transition-all duration-300">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center backdrop-blur-md bg-white/80 border-b border-gray-100 shadow-sm mt-2 rounded-full">
            <a href="index.html" class="flex items-center gap-2 text-[#0A2F1D] cursor-pointer hover:opacity-80 transition">
                <img src="assets/images/logo.png" alt="HerbaPedia Logo" class="w-8 h-8 object-contain">
                <span class="text-xl font-bold tracking-wide font-sans">Herba<span class="text-[#8CC63F]">Pedia</span></span>
            </a>
            <ul class="hidden md:flex gap-8 text-sm font-semibold text-gray-600 items-center nav-links">
                <li><a href="index.html" class="hover:text-[#0A2F1D] transition-colors pb-1 border-b-2 border-transparent">Trang chủ</a></li>
                <li><a href="search.html" class="text-[#0A2F1D] transition-colors pb-1 border-b-2 border-[#8CC63F]">Tra cứu</a></li>
                <li><a href="history.html" class="hover:text-[#0A2F1D] transition-colors pb-1 border-b-2 border-transparent">Cộng đồng</a></li>
                                <li class="relative group">
                    <button class="flex items-center gap-2 bg-white border border-gray-200 px-3 py-1.5 rounded-full hover:shadow-sm transition-all focus:outline-none">
                        <img src="assets/images/logo.png" alt="Avatar" class="w-7 h-7 rounded-full object-cover">
                        <span class="font-bold text-[#0A2F1D] text-sm">Hi,</span>
                        <i data-feather="chevron-down" class="w-4 h-4 text-gray-500 group-hover:rotate-180 transition-transform"></i>
                    </button>
                    <!-- Dropdown Menu -->
                    <div class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-50 transform origin-top-right scale-95 group-hover:scale-100">
                        <div class="py-1">
                            <a href="profile.html" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-[#eef1e6] hover:text-[#1b3b22] hover:font-semibold transition-colors">
                                <i data-feather="user" class="w-4 h-4 text-gray-500"></i> Hồ sơ cá nhân
                            </a>
                            <a href="user-profile.html" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-[#eef1e6] hover:text-[#1b3b22] hover:font-semibold transition-colors">
                                <i data-feather="book-open" class="w-4 h-4 text-gray-500"></i> Blog cá nhân
                            </a>
                            <a href="personal-history.html" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-[#eef1e6] hover:text-[#1b3b22] hover:font-semibold transition-colors">
                                <i data-feather="clock" class="w-4 h-4 text-gray-500"></i> Lịch sử cá nhân
                            </a>
                        </div>
                        <div class="border-t border-gray-100 py-1">
                            <button class="flex w-full items-center gap-3 px-4 py-2.5 text-sm text-red-500 hover:bg-red-50 transition-colors">
                                <i data-feather="log-out" class="w-4 h-4"></i> Đăng xuất
                            </button>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 w-full max-w-7xl mx-auto px-6 flex-1 flex flex-col mt-10 mb-16">
        
        <!-- Khu vực 1: Search & Filters -->
        <div class="w-full flex flex-col items-center mb-12">
            <h1 class="text-3xl md:text-4xl font-bold text-[#0A2F1D] mb-8 font-serif">Từ điển Lá thuốc</h1>
            
            <!-- Search Bar -->
            <div class="relative w-full max-w-3xl mb-6 group">
                <i data-feather="search" class="absolute left-6 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400 group-focus-within:text-[#8CC63F] transition-colors"></i>
                <input type="text" id="searchInput" placeholder="Nhập tên lá cây, tên khoa học hoặc tiếng Anh..." 
                       class="w-full pl-14 pr-6 py-4 rounded-full border border-gray-200 bg-white text-gray-700 outline-none focus:border-[#8CC63F] focus:ring-4 focus:ring-[#8CC63F]/10 shadow-sm transition-all text-lg placeholder-gray-400">
            </div>
            
            <!-- Filter Tags (Scrollable) -->
            <div class="w-full max-w-4xl overflow-x-auto hide-scrollbar py-2">
                <div class="flex items-center justify-center sm:justify-start md:justify-center gap-3 w-max mx-auto px-4">
                    <button class="tag-pill active" data-filter="all">Tất cả</button>
                    <button class="tag-pill" data-filter="thanh nhiệt">Thanh nhiệt</button>
                    <button class="tag-pill" data-filter="giải độc">Giải độc</button>
                    <button class="tag-pill" data-filter="kháng viêm">Kháng viêm</button>
                    <button class="tag-pill" data-filter="an thần">An thần</button>
                    <button class="tag-pill" data-filter="tiêu hóa">Tiêu hóa</button>
                    <button class="tag-pill" data-filter="cầm máu">Cầm máu</button>
                </div>
            </div>
        </div>

        <!-- Khu vực 2: Kết quả (Grid List) -->
        <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="col-span-full text-center text-gray-500 py-12">
                <p class="font-light">Đang tải danh sách dược liệu...</p>
            </div>
        </div>
        <div class="flex justify-between items-center mt-8 text-sm text-gray-500">
            <span id="resultsSummary" aria-live="polite"></span>
            <button id="clearSearch" type="button" class="hidden text-[#0A2F1D] font-bold hover:underline">
                Xóa bộ lọc
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="relative z-10 text-center py-6 text-gray-500 text-sm font-medium mt-auto">
        <p>&copy; 2026 HerbaPedia. Phát triển vì sức khỏe cộng đồng.</p>
    </footer>

    <script src="assets/js/main.js"></script>
    <script src="assets/data/herbs.js"></script>
    <script src="assets/js/search.js"></script>
    <script>
        if (typeof feather !== 'undefined') feather.replace();
    </script>
</body>
</html>
