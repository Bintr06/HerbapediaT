<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhận diện HerbaPedia - HerbaPedia</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        sage: { 50: '#eef1e6' },
                        forest: { 900: '#1b3b22' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-sage-50 font-sans text-gray-800 min-h-screen relative flex flex-col selection:bg-yellow-200">

    <!-- Fixed GPU-composited background layer -->
    <div class="fixed inset-0 z-0 pointer-events-none" style="background-image: linear-gradient(rgba(238, 247, 235, 0.85), rgba(210, 235, 205, 0.9)), url('assets/images/background-forest.jpg'); background-size: cover; background-position: center; transform: translateZ(0); will-change: transform;"></div>

    <!-- Background Shadows -->
    <img src="https://images.unsplash.com/photo-1628155930542-3c7a64e2c848?auto=format&fit=crop&w=600&q=80" alt="Shadow" class="fixed -top-10 -left-32 w-[40rem] opacity-[0.04] pointer-events-none transform -rotate-12 grayscale z-0" style="transform: translateZ(0); will-change: transform;">
    
    <!-- Header / Navbar -->
    <header id="navbar" class="sticky top-0 w-full z-50 transition-all duration-300">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center backdrop-blur-md bg-white/40 border-b border-white/40 shadow-sm mt-2 rounded-full">
            <a href="index.html" class="flex items-center gap-2 text-forest-900 cursor-pointer hover:opacity-80 transition">
                <img src="assets/images/logo.png" alt="HerbaPedia Logo" class="w-8 h-8 object-contain">
                <span class="text-xl font-bold tracking-wide font-sans">Herba<span class="text-yellow-500">Pedia</span></span>
            </a>
            <ul class="hidden md:flex gap-8 text-sm font-semibold text-gray-600 items-center nav-links">
                <li><a href="index.html" class="hover:text-forest-900 transition-colors border-b-2 border-transparent hover:border-yellow-400 pb-1">Trang chủ</a></li>
                <li><a href="search.html" class="hover:text-forest-900 transition-colors border-b-2 border-transparent hover:border-yellow-400 pb-1">Tra cứu</a></li>
                <li><a href="history.html" class="hover:text-forest-900 transition-colors border-b-2 border-transparent hover:border-yellow-400 pb-1">Cộng đồng</a></li>
                                <li class="relative group">
                    <button class="flex items-center gap-2 bg-white border border-gray-200 px-3 py-1.5 rounded-full hover:shadow-sm transition-all focus:outline-none">
                        <img src="assets/images/logo.png" alt="Avatar" class="w-7 h-7 rounded-full object-cover">
                        <span class="font-bold text-[#0A2F1D] text-sm">Hi,</span>
                        <i data-feather="chevron-down" class="w-4 h-4 text-gray-500 group-hover:rotate-180 transition-transform"></i>
                    </button>
                    <!-- Dropdown Menu -->
                    <div class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-50 transform origin-top-right scale-95 group-hover:scale-100">
                        <div class="py-1">
                            <a href="profile.html" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-[#eef1e6] hover:text-[#1b3b22] hover:font-semibold transition-colors">
                                <i data-feather="user" class="w-4 h-4 text-gray-500"></i> Hồ sơ cá nhân
                            </a>
                            <a href="user-profile.html" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-[#eef1e6] hover:text-[#1b3b22] hover:font-semibold transition-colors">
                                <i data-feather="book-open" class="w-4 h-4 text-gray-500"></i> Blog cá nhân
                            </a>
                            <a href="personal-history.html" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-[#eef1e6] hover:text-[#1b3b22] hover:font-semibold transition-colors">
                                <i data-feather="clock" class="w-4 h-4 text-gray-500"></i> Lịch sử cá nhân
                            </a>
                        </div>
                        <div class="border-t border-gray-100 py-1">
                            <button class="flex w-full items-center gap-3 px-4 py-2.5 text-sm text-red-500 hover:bg-red-50 transition-colors">
                                <i data-feather="log-out" class="w-4 h-4"></i> Đăng xuất
                            </button>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 w-full flex-1 flex flex-col items-center justify-center py-12 px-4">
        
                <!-- Result Box (Botanical Style) -->
        <div class="w-full max-w-xl bg-white rounded-2xl overflow-hidden shadow-2xl flex flex-col">
            
            <!-- Header -->
            <div class="bg-white p-5 border-b border-gray-100 flex items-center justify-between">
                <div class="flex items-center gap-2 flex-wrap">
                    <i data-feather="cpu" class="w-6 h-6 text-[#8CC63F]"></i>
                    <h3 class="font-bold text-xl text-forest-900 tracking-tight">Nhận diện HerbaPedia</h3>
                    <span id="resultModelBadge" class="hidden text-xs px-2.5 py-0.5 rounded-full bg-forest-900/10 text-forest-900 font-semibold"></span>
                </div>
                <a href="index.html" class="w-9 h-9 rounded-full text-gray-400 flex items-center justify-center hover:bg-gray-100 hover:text-gray-600 transition-colors">
                    <i data-feather="x" class="w-5 h-5"></i>
                </a>
            </div>

            <!-- Body -->
            <div class="p-6 bg-white flex flex-col gap-6">
                <!-- Image Area -->
                <div class="bg-[#F7F9F5] p-3 rounded-xl flex justify-center items-center">
                    <img id="resultImage" src="https://images.unsplash.com/photo-1596484552834-6a58f850e0a1?w=600&h=400&fit=crop" class="rounded-xl shadow-sm w-full h-48 object-cover" alt="Scanned Leaf">
                </div>

                <!-- Info Cards Area -->
                <div class="flex flex-col gap-4">
                    <!-- Thẻ 1 -->
                    <div class=" rounded-xl border border-gray-100 shadow-[0_2px_10px_-3px_rgba(0,0,0,0.02)] border-l-4 border-l-[#8CC63F] p-4 w-full">
                        <div class="flex items-center gap-1.5 text-gray-400 mb-1">
                            <i data-feather="tag" class="w-3.5 h-3.5"></i>
                            <span class="text-xs font-semibold uppercase tracking-wider">Tên nhận diện</span>
                        </div>
                        <p data-predicted-class class="text-forest-900 font-bold text-lg mt-1">Lá Tía Tô (Perilla frutescens)</p>
                        <p id="resultScientific" class="text-xs text-gray-500 italic mt-0.5"></p>
                    </div>

                    <!-- Grid 3 cột -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <!-- Thẻ 2 -->
                        <div class=" rounded-xl border border-gray-100 shadow-[0_2px_10px_-3px_rgba(0,0,0,0.02)] border-l-4 border-l-[#8CC63F] p-3.5 flex flex-col justify-between">
                            <div class="flex items-center gap-1.5 text-gray-400 mb-2">
                                <i data-feather="check-circle" class="w-3.5 h-3.5"></i>
                                <span class="text-xs font-semibold uppercase tracking-wider">Độ tin cậy</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span data-confidence class="text-[#8CC63F] font-bold text-lg">96%</span>
                                <div class="flex-1 bg-gray-200 h-1.5 rounded-full overflow-hidden">
                                    <div data-confidence-bar class="bg-[#8CC63F] h-full rounded-full" style="width: 96%"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Thẻ Model AI -->
                        <div class=" rounded-xl border border-gray-100 shadow-[0_2px_10px_-3px_rgba(0,0,0,0.02)] border-l-4 border-l-[#8CC63F] p-3.5 flex flex-col justify-between">
                            <div class="flex items-center gap-1.5 text-gray-400 mb-2">
                                <i data-feather="cpu" class="w-3.5 h-3.5"></i>
                                <span class="text-xs font-semibold uppercase tracking-wider">Mô hình</span>
                            </div>
                            <p class="text-forest-900 font-bold text-xs truncate" id="resultModelText">MobileNetV3</p>
                        </div>

                        <!-- Thẻ Thời gian -->
                        <div class=" rounded-xl border border-gray-100 shadow-[0_2px_10px_-3px_rgba(0,0,0,0.02)] border-l-4 border-l-[#8CC63F] p-3.5 flex flex-col justify-between">
                            <div class="flex items-center gap-1.5 text-gray-400 mb-2">
                                <i data-feather="clock" class="w-3.5 h-3.5"></i>
                                <span class="text-xs font-semibold uppercase tracking-wider">Thời gian</span>
                            </div>
                            <p class="text-gray-600 font-medium text-xs truncate" id="resultTime">14:43:05</p>
                        </div>
                    </div>

                    <!-- Top Candidates Box -->
                    <div id="topCandidatesBox" class="hidden flex flex-col gap-2 p-3 bg-gray-50/70 rounded-xl border border-gray-100 mt-1">
                        <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider flex items-center gap-1">
                            <i data-feather="layers" class="w-3 h-3"></i> Các khả năng khác
                        </span>
                        <div id="topCandidatesList" class="flex flex-col gap-1.5"></div>
                    </div>
                </div>
            </div>


            <!-- Footer -->
            <div class="bg-white p-5 border-t border-gray-100 flex items-center justify-end gap-3">
                <a href="index.html" class="text-gray-600 rounded-full px-6 py-2.5 text-sm font-semibold hover: transition-colors">
                    Đóng
                </a>
                <a href="detail.html" class="bg-forest-900 text-white rounded-full px-6 py-2.5 text-sm font-bold hover:bg-[#132a18] shadow-md hover:-translate-y-0.5 transition-all flex items-center gap-2">
                    <i data-feather="arrow-right" class="w-4 h-4"></i> Xem chi tiết
                </a>
            </div>
        </div>
    </main>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        feather.replace();
        
        // Cập nhật giờ hiện tại
        const now = new Date();
        const timeEl = document.getElementById('resultTime');
        if (timeEl) {
            timeEl.innerText = now.toLocaleTimeString('vi-VN') + ' ' + now.toLocaleDateString('vi-VN');
        }

        // Lấy ảnh từ localStorage nếu có (từ camera)
        const storedImage = localStorage.getItem('lastCapturedImage');
        if (storedImage) {
            document.getElementById('resultImage').src = storedImage;
            localStorage.removeItem('lastCapturedImage'); // Clear sau khi dùng
        }

        const prediction = JSON.parse(localStorage.getItem('lastPrediction') || 'null');
        if (prediction) {
            const classElements = document.querySelectorAll('[data-predicted-class]');
            classElements.forEach((element) => {
                element.innerText = prediction.predicted_class || 'Không xác định';
            });

            const scientificEl = document.getElementById('resultScientific');
            if (scientificEl && prediction.scientific_name) {
                scientificEl.innerText = prediction.scientific_name;
            }

            const modelName = prediction.model_name || (prediction.model_id === 'custom_cnn' ? 'Custom CNN' : 'MobileNetV3');
            const modelBadge = document.getElementById('resultModelBadge');
            if (modelBadge) {
                modelBadge.innerText = modelName;
                modelBadge.classList.remove('hidden');
            }
            const modelText = document.getElementById('resultModelText');
            if (modelText) {
                modelText.innerText = modelName;
            }

            const confidenceElements = document.querySelectorAll('[data-confidence]');
            confidenceElements.forEach((element) => {
                element.innerText = prediction.confidence || '0%';
            });
            const confidenceValue = Number.parseFloat(prediction.confidence);
            const confidenceBar = document.querySelector('[data-confidence-bar]');
            if (confidenceBar && Number.isFinite(confidenceValue)) {
                confidenceBar.style.width = `${Math.min(100, Math.max(0, confidenceValue))}%`;
            }

            // Hiển thị top candidates nếu có
            if (Array.isArray(prediction.top_candidates) && prediction.top_candidates.length > 1) {
                const box = document.getElementById('topCandidatesBox');
                const list = document.getElementById('topCandidatesList');
                if (box && list) {
                    list.innerHTML = '';
                    prediction.top_candidates.slice(1, 4).forEach((c) => {
                        const row = document.createElement('div');
                        row.className = 'flex items-center justify-between text-xs py-1 px-2 rounded-lg bg-white/70 border border-gray-100';
                        row.innerHTML = `
                            <div class="flex items-center gap-1.5 truncate">
                                <span class="font-bold text-forest-900">${c.name}</span>
                                <span class="text-gray-400 italic text-[11px] truncate">${c.scientific || ''}</span>
                            </div>
                            <span class="font-semibold text-gray-500 shrink-0 ml-2">${c.confidence}</span>
                        `;
                        list.appendChild(row);
                    });
                    box.classList.remove('hidden');
                }
            }

            const detailLink = document.querySelector('a[href="detail.html"]');
            if (detailLink) {
                const targetKey = prediction.herb_slug || prediction.predicted_class;
                detailLink.href = `detail.html?id=${encodeURIComponent(targetKey)}`;
            }
            localStorage.removeItem('lastPrediction');
        }
        feather.replace();
    </script>
</body>
</html>
